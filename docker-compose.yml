# Local build-and-run stack: builds the image from source and runs it against an EXTERNAL database.
# Copy .env.example to .env and fill in the DB connection + AWS credentials, then: docker compose up --build
#
# Notes:
# - Runs the `prod` Spring profile. The database is external (no Postgres container here) —
#   set BUDDYDROP_DB_URL to point at your PostgreSQL (a local instance, or RDS).
# - BUDDYDROP_COOKIE_SECURE=false lets the session cookie work over plain HTTP on localhost;
#   set it back to true behind HTTPS.
# - Email defaults to `log` so the app runs without SES; set BUDDYDROP_MAIL_PROVIDER=ses to send.
# - For a production deploy (Caddy TLS + image pulled from Docker Hub), see deploy/ and
#   scripts/deploy-ec2.sh.

services:
  app:
    build: .
    image: ${DOCKER_IMAGE:-buddydrop}:${TAG:-latest}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      BUDDYDROP_BASE_URL: ${BUDDYDROP_BASE_URL:-http://localhost:8080}
      BUDDYDROP_COOKIE_SECURE: ${BUDDYDROP_COOKIE_SECURE:-false}
      # Database (external — set these in .env)
      BUDDYDROP_DB_URL: ${BUDDYDROP_DB_URL:?set BUDDYDROP_DB_URL (jdbc:postgresql://host:5432/db)}
      BUDDYDROP_DB_USER: ${BUDDYDROP_DB_USER:-buddydrop}
      BUDDYDROP_DB_PASSWORD: ${BUDDYDROP_DB_PASSWORD:-}
      # S3
      BUDDYDROP_S3_BUCKET: ${BUDDYDROP_S3_BUCKET:-buddydrop-dev}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BUDDYDROP_STORAGE_CONFIGURE_CORS: ${BUDDYDROP_STORAGE_CONFIGURE_CORS:-false}
      # Email (log = don't actually send; ses/smtp to deliver)
      BUDDYDROP_MAIL_PROVIDER: ${BUDDYDROP_MAIL_PROVIDER:-log}
      BUDDYDROP_MAIL_FROM: ${BUDDYDROP_MAIL_FROM:-no-reply@buddydrop.app}
    restart: unless-stopped
