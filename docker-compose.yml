# Local/prod-shaped stack: BuddyDrop + PostgreSQL.
# Copy .env.example to .env and fill in AWS credentials + bucket, then: docker compose up --build
#
# Notes:
# - Runs the `prod` Spring profile (PostgreSQL + real email transport).
# - BUDDYDROP_COOKIE_SECURE=false lets the session cookie work over plain HTTP on localhost;
#   set it back to true behind HTTPS.
# - Email defaults to `log` so the app runs without SES; set BUDDYDROP_MAIL_PROVIDER=ses to send.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buddydrop
      POSTGRES_USER: buddydrop
      POSTGRES_PASSWORD: ${BUDDYDROP_DB_PASSWORD:-buddydrop}
    volumes:
      - buddydrop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddydrop -d buddydrop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    image: ${DOCKER_IMAGE:-buddydrop}:${TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      BUDDYDROP_BASE_URL: ${BUDDYDROP_BASE_URL:-http://localhost:8080}
      BUDDYDROP_COOKIE_SECURE: ${BUDDYDROP_COOKIE_SECURE:-false}
      # Database (points at the db service on the compose network)
      BUDDYDROP_DB_URL: jdbc:postgresql://db:5432/buddydrop
      BUDDYDROP_DB_USER: buddydrop
      BUDDYDROP_DB_PASSWORD: ${BUDDYDROP_DB_PASSWORD:-buddydrop}
      # S3
      BUDDYDROP_S3_BUCKET: ${BUDDYDROP_S3_BUCKET:-buddydrop-dev}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BUDDYDROP_STORAGE_CONFIGURE_CORS: ${BUDDYDROP_STORAGE_CONFIGURE_CORS:-false}
      # Email (log = don't actually send; ses/smtp to deliver)
      BUDDYDROP_MAIL_PROVIDER: ${BUDDYDROP_MAIL_PROVIDER:-log}
      BUDDYDROP_MAIL_FROM: ${BUDDYDROP_MAIL_FROM:-no-reply@buddydrop.app}
    restart: unless-stopped

volumes:
  buddydrop-db:
