<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Check your inbox · BuddyAi Drop-In')}"></head>
<body>
<main class="center-shell">
  <div class="auth-card">
    <div class="notice notice-info">
      <span class="notice-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
        </svg>
      </span>
      <p style="margin:0 0 6px;text-align:center;font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink)">
        Check your inbox
      </p>
      <p style="margin:0;text-align:center">
        We sent a sign-in link to <strong th:text="${email}">you@company.com</strong>.
        It expires in 15 minutes and can be used once.
      </p>
    </div>
    <p class="muted" style="margin-top:var(--space-4)">
      Didn't get it? <a th:href="@{/login}">Try another address</a>.
    </p>
  </div>
</main>
</body>
</html>
