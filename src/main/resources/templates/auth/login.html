<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in · BuddyDrop')}"></head>
<body>
<main class="center-shell">
  <div class="auth-card">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2C8 8 5 11 5 15a7 7 0 0014 0c0-4-3-7-7-13z"/></svg>
    </span>
    <h1>Sign in to BuddyDrop</h1>
    <p class="subtitle">We'll email you a secure link. No password to remember.</p>

    <p th:if="${error}" class="field-error" th:text="${error}">Error</p>

    <form th:action="@{/auth/request}" method="post">
      <div class="field">
        <label class="label" for="email">Email address</label>
        <input class="input" type="email" id="email" name="email" required autofocus
               autocomplete="email" placeholder="you@company.com" th:value="${email}">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Send me a magic link</button>
    </form>
  </div>
</main>
</body>
</html>
