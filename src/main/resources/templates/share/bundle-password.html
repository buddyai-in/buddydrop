<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Protected files · BuddyAi Drop-In')}"></head>
<body>
<main class="center-shell">
  <div class="public-card">
    <span class="file-icon" data-kind="zip" style="width:54px;height:54px;border-radius:14px;margin:0 auto var(--space-4);font-size:12px">ZIP</span>
    <h1>Protected files</h1>
    <p class="file-sub">These files are password protected.</p>
    <form th:action="@{'/d/' + ${token}}" method="post">
      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" required autofocus
               autocomplete="off" placeholder="Enter password">
      </div>
      <p th:if="${error}" class="field-error" th:text="${error}">Incorrect password</p>
      <button class="btn btn-primary btn-block" type="submit">Unlock</button>
    </form>
    <p class="muted public-footer">Delivered securely by <a th:href="@{/login}">BuddyAi Drop-In</a></p>
  </div>
</main>
</body>
</html>
