<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Protected file · BuddyAi Drop-In')}"></head>
<body>
<main class="center-shell">
  <div class="public-card">
    <span class="file-icon" th:attr="data-kind=${#strings.toLowerCase(ext)}" th:text="${ext}">PDF</span>
    <h1 th:text="${filename}">document.pdf</h1>
    <p class="file-sub">This file is password protected.</p>
    <form th:action="@{'/s/' + ${token}}" method="post">
      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" required autofocus
               autocomplete="off" placeholder="Enter password">
      </div>
      <p th:if="${error}" class="field-error" th:text="${error}">Incorrect password</p>
      <button class="btn btn-primary btn-block" type="submit">Unlock &amp; download</button>
    </form>
    <p class="muted public-footer">Delivered securely by <a th:href="@{/login}">BuddyAi Drop-In</a></p>
  </div>
</main>
</body>
</html>
