# Production: PostgreSQL + Amazon SES for email, all secrets supplied via environment.
# Email defaults to the SES API (no SMTP creds needed — uses the AWS credential chain). To use an
# SMTP relay instead, set BUDDYDROP_MAIL_PROVIDER=smtp and the spring.mail.* values below.
spring:
  datasource:
    url: ${BUDDYDROP_DB_URL:jdbc:postgresql://localhost:5432/buddydrop}
    username: ${BUDDYDROP_DB_USER:buddydrop}
    password: ${BUDDYDROP_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${BUDDYDROP_DB_POOL_MAX:10}
  mail:
    host: ${BUDDYDROP_SMTP_HOST:}
    port: ${BUDDYDROP_SMTP_PORT:587}
    username: ${BUDDYDROP_SMTP_USER:}
    password: ${BUDDYDROP_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

buddydrop:
  mail:
    provider: ${BUDDYDROP_MAIL_PROVIDER:ses}

server:
  servlet:
    session:
      cookie:
        secure: true
