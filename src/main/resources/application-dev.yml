# Local development: in-memory H2 (no external database), Thymeleaf hot-reload, no SMTP.
# The magic-link URL is logged to the console (see MailService) so you can sign in without a mail server.
spring:
  datasource:
    url: jdbc:h2:mem:buddydrop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  thymeleaf:
    cache: false

buddydrop:
  storage:
    # Auto-apply bucket CORS on startup so browser uploads from http://localhost:8080 are allowed.
    # Requires the dev credentials to have s3:PutBucketCORS on the bucket.
    configure-cors: true

logging:
  level:
    com.buddyai.buddydrop: DEBUG
