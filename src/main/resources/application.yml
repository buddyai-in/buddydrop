spring:
  application:
    name: buddydrop
  # Local development runs against in-memory H2 with a logging mail sender.
  # Production activates the "prod" profile (PostgreSQL + real SMTP) via SPRING_PROFILES_ACTIVE=prod.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  thymeleaf:
    cache: true

server:
  # Trust proxy headers so generated absolute URLs are correct behind a load balancer.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${BUDDYDROP_SESSION_TIMEOUT:60m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${BUDDYDROP_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

buddydrop:
  base-url: ${BUDDYDROP_BASE_URL:http://localhost:8080}
  auth:
    token-ttl: ${BUDDYDROP_TOKEN_TTL:15m}
    session-ttl: ${BUDDYDROP_SESSION_TIMEOUT:60m}
    max-requests-per-window: 5
    request-window: 15m
  storage:
    bucket: ${BUDDYDROP_S3_BUCKET:buddydrop-dev}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${BUDDYDROP_S3_ENDPOINT:}
    path-style-access: ${BUDDYDROP_S3_PATH_STYLE:false}
    presign-ttl: 10m
    quota-bytes: ${BUDDYDROP_QUOTA_BYTES:10737418240}      # 10 GB
    max-upload-bytes: ${BUDDYDROP_MAX_UPLOAD_BYTES:5368709120} # 5 GB
  mail:
    from: ${BUDDYDROP_MAIL_FROM:no-reply@buddydrop.app}
    from-name: BuddyDrop

logging:
  level:
    com.buddyai.buddydrop: INFO
